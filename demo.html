<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6457">
<meta name="robots" content="noindex">
<title>お申込み体験版</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="お申込み">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6F7;--surface:#FFFFFF;--ink:#16222B;--muted:#5B6A75;--line:#D3DCE2;
  --seal:#1F6457;--seal-ink:#FFFFFF;--seal-soft:#E2EFEB;
  --ai:#FFF3CC;--ai-line:#C9961A;--ai-ink:#6B4E00;
  --danger:#AE3A2A;--dock-h:84px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F161B;--surface:#172128;--ink:#E5EDF1;--muted:#97A7B2;--line:#2A3943;
  --seal:#4E9F8D;--seal-ink:#06110E;--seal-soft:#1B2F2A;
  --ai:#382D10;--ai-line:#D9AE3E;--ai-ink:#F2D58A;--danger:#E07A69;
}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(var(--dock-h) + 48px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-title{flex:1;min-width:0;margin:0;font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save{font-size:.76rem;color:var(--muted);white-space:nowrap;background:none;border:0;padding:4px;cursor:default}
.save.bad{color:var(--danger);cursor:pointer;text-decoration:underline}
.status-sel{font-size:.85rem;min-height:36px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--seal-ink);font-weight:700}
.btn.outline{border-color:var(--seal);color:var(--seal);background:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.sm{min-height:36px;padding:0 10px;font-size:.88rem}
.btn.wide{width:100%}
a.btn{text-decoration:none;color:inherit}
a.btn.outline{color:var(--seal)}
a.btn.ghost{color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{flex:none;width:40px;height:40px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
.sec-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:transparent;text-align:left;cursor:pointer}
.num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.sec.done .num{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.sec-title{flex:1;font-weight:700}
.count{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px;transition:transform .2s}
.sec-head[aria-expanded="false"] .chev{transform:rotate(-45deg);margin-bottom:0}
.sec-body{padding:2px 16px 18px;display:grid;gap:14px}
.note{margin:0;padding:10px 12px;border-radius:8px;background:var(--seal-soft);font-size:.86rem}

.field{display:grid;gap:4px}
.field-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.field label{font-size:.88rem;font-weight:500}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.field textarea{resize:vertical;min-height:84px}
.hint{color:var(--muted);font-size:.78rem}
.field.ai input,.field.ai select,.field.ai textarea{background:var(--ai);border-color:var(--ai-line)}
.ok-btn{display:none;border:1px solid var(--ai-line);background:var(--ai);color:var(--ai-ink);font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 10px;cursor:pointer;white-space:nowrap}
.field.ai .ok-btn{display:inline-block}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.dock-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.dock-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:.78rem;font-weight:500;line-height:1.3;cursor:pointer;text-align:center}
.dock-btn svg{width:24px;height:24px}
.dock-btn.primary{background:var(--seal);border-color:var(--seal);color:var(--seal-ink);font-weight:700;font-size:.88rem}

.list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.row{width:100%;display:grid;grid-template-columns:1fr auto;grid-template-areas:"name chip" "date chip";gap:0 10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer}
.row-name{grid-area:name;font-weight:700}
.row-date{grid-area:date;font-size:.78rem;color:var(--muted)}
.chip{grid-area:chip;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.chip.s-b{border-color:var(--ai-line);color:var(--ai-ink);background:var(--ai)}
.chip.s-c{border-color:var(--seal);color:var(--seal-ink);background:var(--seal)}
.search{width:100%;min-height:46px;margin-top:12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.pad{padding:12px 4px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.err{color:var(--danger);margin:0}

.login,.setup{max-width:420px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top,0px)) 20px 40px;display:grid;gap:14px}
.login h1,.setup h1{margin:0;font-size:1.6rem;letter-spacing:.02em}
.login p,.setup p{margin:0}
.lbl{display:grid;gap:4px;font-size:.88rem;font-weight:500}
.lbl input{min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}

.backdrop{position:fixed;inset:0;z-index:50;background:rgba(8,16,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:92vh;overflow:auto}
.sheet-top{display:flex;align-items:center;justify-content:space-between}
.sheet h2{margin:0;font-size:1.1rem}
.mic{justify-self:center;width:96px;height:96px;border-radius:50%;border:0;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;cursor:pointer;position:relative}
.mic svg{width:40px;height:40px}
.mic:disabled{opacity:.4;cursor:default}
.mic[aria-pressed="true"]{background:var(--danger)}
.mic[aria-pressed="true"]::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--danger);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{transform:scale(.92);opacity:.7}to{transform:scale(1.18);opacity:0}}
.mic-label{text-align:center;font-weight:700;margin:0}
.transcript{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px;line-height:1.6;resize:vertical}

.busy{position:fixed;inset:0;z-index:60;background:rgba(8,16,20,.5);display:grid;place-items:center}
.busy-card{background:var(--surface);padding:20px 24px;border-radius:14px;display:flex;align-items:center;gap:12px;font-weight:700}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--seal);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-h) + 22px + env(safe-area-inset-bottom,0px));z-index:70;pointer-events:none;width:max-content;max-width:min(92vw,560px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.danger-zone{margin-top:28px;display:grid}
@media (prefers-reduced-motion:reduce){.mic[aria-pressed="true"]::after,.spinner{animation:none}.chev{transition:none}}

.hero{max-width:560px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 20px 40px;display:grid;gap:16px}
.hero h1{margin:0;font-size:1.5rem;line-height:1.4}
.hero p{margin:0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.steps .num{margin-top:1px}
.consent{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.88rem}
.consent ul{margin:6px 0 0;padding-left:1.2em;display:grid;gap:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500;cursor:pointer}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--seal);flex:none}
.submit-zone{margin-top:20px;display:grid;gap:8px}
.center{text-align:center}
.big-icon{font-size:2.6rem;line-height:1}

.script{border:1px dashed var(--seal);background:var(--seal-soft);border-radius:12px;padding:12px 14px;max-height:38vh;overflow:auto}
.script-wrap{position:relative}
.script-wrap.has-more::after{content:"";position:absolute;left:1px;right:1px;bottom:1px;height:56px;border-radius:0 0 12px 12px;background:linear-gradient(to bottom,transparent,var(--seal-soft) 75%);pointer-events:none}
.script-more{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:1;padding:6px 16px;border-radius:999px;border:0;background:var(--seal);color:var(--seal-ink);font:inherit;font-size:.86rem;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.18);cursor:pointer;white-space:nowrap}
.script-head{display:grid;gap:2px;margin-bottom:6px}
.script ol{margin:0;padding-left:1.4em;display:grid;gap:6px;font-size:.95rem;line-height:1.6}
.script mark{background:var(--ai);color:var(--ai-ink);border-radius:4px;padding:0 2px}

.doc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hp-box{margin:14px 0;padding:14px;border-radius:12px;border:2px solid var(--seal);background:var(--seal-soft)}
.hp-box.unset{border-color:var(--ai-line);background:var(--ai)}
.hp-box.flash{animation:hpflash .9s 2}
@keyframes hpflash{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ai-line) 45%,transparent)}}
.hp-q{margin:0;font-size:1.12rem;font-weight:800}
.hp-sub{margin:2px 0 10px;font-size:.84rem;color:var(--muted)}
.hp-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hp-opt{min-height:52px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:1.05rem;font-weight:700;cursor:pointer}
.hp-opt.on{border-color:var(--seal);background:var(--seal);color:var(--seal-ink)}
.doc-badge{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--ai-line);background:var(--ai);color:var(--ai-ink);white-space:nowrap}
.doc-badge.ok{border-color:var(--seal);background:var(--seal);color:var(--seal-ink)}
.shot-tips{display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.shot-tips ul{margin:0;padding-left:1.1em;font-size:.84rem;display:grid;gap:2px}
.frame{position:relative;width:84px;height:58px;flex:none}
.frame .card{position:absolute;inset:9px;border-radius:5px;background:var(--seal-soft);border:1.5px solid var(--seal)}
.frame .c{position:absolute;width:15px;height:15px;border:0 solid var(--danger)}
.frame .tl{top:0;left:0;border-top-width:3px;border-left-width:3px}
.frame .tr{top:0;right:0;border-top-width:3px;border-right-width:3px}
.frame .bl{bottom:0;left:0;border-bottom-width:3px;border-left-width:3px}
.frame .br{bottom:0;right:0;border-bottom-width:3px;border-right-width:3px}
.doc-group{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.doc-group.card-need{border:2px solid #A8564B;background:#F7E9E6}
.doc-group.card-need .doc-title{color:#7E3328}
.doc-group.card-need .doc-row{border-top-color:#E3C3BD}
.doc-group.card-need .btn.outline{border-color:#A8564B;background:#A8564B;color:#fff}
.zip-fix{display:flex;margin-top:6px}
#cf-payment.card-need-box,.sec.secret.card-need-box{border:2px solid #A8564B;background:#F7E9E6}
#cf-payment.card-need-box .card-entry,.sec.secret.card-need-box .card-entry{background:transparent}
.card-need-box .card-scan{border-color:#A8564B;background:#A8564B;color:#fff}
.card-need-note{margin:0;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid #D9A79F;color:#8E3F35;font-weight:700;font-size:.88rem}
.card-entry:not(.card-need-box) .card-need-note{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #cf-payment.card-need-box,:root:not([data-theme="light"]) .sec.secret.card-need-box{background:#33201D;border-color:#C27368}:root:not([data-theme="light"]) .card-need-note{background:#172128;color:#F0B8AE}}
.card-need-msg{color:#8E3F35;font-weight:800}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .doc-group.card-need{background:#33201D;border-color:#C27368}:root:not([data-theme="light"]) .doc-group.card-need .doc-title{color:#F0B8AE}}
.doc-group.done{border-color:var(--seal)}
.doc-name{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:2px 0 4px}
.doc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.doc-label{display:grid;gap:0}
.doc-row.retake{margin:0 -8px;padding:8px;border-radius:10px;background:#FDECEA;border-top-color:transparent}
.retake-msg{color:var(--danger);font-weight:700}
.retake-banner{display:block;width:100%;margin:10px 0 0;padding:10px 12px;border-radius:10px;border:1.5px solid var(--danger);background:#FDECEA;color:#8A2A1D;font:inherit;font-size:.9rem;text-align:left;cursor:pointer}
.retake-target{display:flex;align-items:center;gap:12px;margin:4px 0 10px;padding:12px;border-radius:12px;border:2px solid var(--danger);background:var(--surface)}
.retake-target strong{display:block;font-size:1.15rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .doc-row.retake,:root:not([data-theme="light"]) .retake-banner{background:#3A1E1A;color:#F2B8AE}}
.doc-actions{display:flex;gap:6px;flex:none}
.doc-ok{color:var(--seal);font-weight:700;font-size:.8rem}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip-btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:.84rem;cursor:pointer;min-height:34px}
.chip-btn:active{background:var(--seal-soft);border-color:var(--seal)}
.chip-btn.on{background:var(--seal);border-color:var(--seal);color:var(--seal-ink);font-weight:700}
.warn{margin:0;padding:10px 12px;border-radius:8px;background:#FDECEA;color:#8A2A1D;border:1px solid #F2B8AE;font-size:.88rem;display:grid;gap:4px}
.warn p{margin:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3A1E1A;color:#F2B8AE;border-color:#6B3328}}

.progress{list-style:none;margin:0;padding:10px 12px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:720px;margin-inline:auto}
.progress li{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);text-align:center}
.pstep{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;min-height:44px;padding:2px 0;border:0;border-radius:8px;background:transparent;font:inherit;color:inherit;cursor:pointer}
.pstep:active{background:var(--seal-soft)}
.progress li .num{width:26px;height:26px;font-size:.8rem}
.progress li.now{color:var(--ink);font-weight:700}
.progress li.now .num{border-color:var(--seal);color:var(--seal);border-width:2px}
.progress li.done .num{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.lead{margin:4px 0 14px;font-size:.98rem}
.wiz{padding-bottom:calc(var(--dock-h) + 70px + env(safe-area-inset-bottom,0px))}
.nav-wrap{max-width:720px;margin:0 auto;display:grid;gap:6px}
.nav-in{grid-template-columns:1fr 1.6fr}
.nav-hint{margin:0;text-align:center;font-size:.8rem;color:var(--muted)}
.mini{margin:8px 0;padding-left:1.2em;display:grid;gap:4px;font-size:.9rem}
.tall{min-height:58px;font-size:1.02rem}
.done-note{margin:0 0 12px;padding:14px;border-radius:12px;background:var(--seal-soft);font-weight:700;color:var(--seal)}
.done-sub{display:block;margin-top:4px;color:var(--ink);font-size:.95rem}
.cf-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cf-row{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.cf-row.ai .cf-val{background:var(--ai);border-radius:4px;padding:0 4px}
.cf-label{color:var(--muted)}
.cf-val{word-break:break-all}
.cf-val.empty,.cf-row.num-check .cf-val.empty{justify-self:start;align-self:start;width:fit-content;height:fit-content;color:#fff;background:var(--danger);font-weight:800;font-size:.86rem;letter-spacing:0;padding:1px 10px;border-radius:999px}
.cf.editing{border-color:var(--seal)}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sum-block{padding-bottom:10px;border-bottom:1px solid var(--line)}
.sum-block .sum-row{border-bottom:0}
.sum-link{width:100%;border:0;background:transparent;text-align:left;cursor:pointer;font:inherit;color:inherit;min-height:44px}
.jump-group{margin-top:8px}
.jump-sec{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.jump-list{display:flex;flex-wrap:wrap;gap:6px}
.jump-chip{min-height:36px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--danger);background:transparent;color:var(--danger);font-size:.85rem;font-weight:700;cursor:pointer}
.doc-group.flash,.field.flash,.cf.flash{animation:hpflash .9s 2;border-radius:10px}
html.big .wrap,html.big .progress,html.big .nav-wrap{zoom:1.15}

.doc-name{gap:10px;justify-content:flex-start}
.doc-title{flex:1}
.doc-ill{width:54px;height:38px;flex:none;display:inline-flex}
.doc-ill svg,.tip-ill svg,.need-ill svg,.hero-ill svg,.flow-ill svg{width:100%;height:100%}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;background:var(--paper);font-size:.78rem;font-weight:700;text-align:center}
.tip-ill{width:34px;height:34px;display:inline-flex}

.welcome h1{text-align:center;font-size:1.55rem;line-height:1.35;font-weight:800}

.need{background:var(--surface);border-radius:22px;padding:16px;box-shadow:0 2px 14px rgba(46,125,107,.08);display:grid;gap:12px}
.need-head{display:flex;align-items:center;justify-content:space-between;gap:8px}

.need-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.need-card{position:relative;background:var(--paper);border-radius:16px;padding:10px 8px 12px;display:grid;justify-items:center;gap:4px}
.need-ill{width:100%;max-width:120px;aspect-ratio:120/84;display:block}
.need-name{font-weight:700;font-size:.92rem}
.need-tag{position:absolute;top:6px;right:6px;background:var(--accent);color:#3A2A00;font-family:var(--round);font-weight:800;font-size:.68rem;border-radius:999px;padding:2px 8px}
.need-note{margin:0;font-size:.84rem;color:var(--muted);text-align:center}
.for-name{margin:0;display:inline-block;justify-self:center;background:var(--seal-soft);color:var(--seal);font-weight:800;border-radius:999px;padding:6px 16px;font-size:.92rem}
.need-more{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.bg-pill{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;width:calc(100% - 32px);max-width:560px;padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.15);font-size:.86rem;font-weight:700;line-height:1.45;pointer-events:none}

</style>
<script>
/* 体験版：読み取り（写真・音声・勤務先検索）は本番と同じAIを使う。
   保存・スプレッドシート送信はしない（データベースにも、写真の置き場にも残らない）。
   読み取りは体験版専用の窓口 onboarding-demo を使う（保存・送信の機能がない窓口） */
const DEMO_FUNCTION = 'onboarding-demo';
const DEMO_AI_MODES = new Set(['transcribe', 'card', 'mynumber', 'bank', 'image', 'voice', 'company']);
// 担当者が先に入れておく「ご契約内容」（本番でも、お客様が開く前に担当者が入れている）
const DEMO_PRESET = { product_type: 'EVO', contract_years: '15年', monthly_usd: '200', fund_choice: '分散ファンド', introducer_name: '山田（仮）' };
async function demoAI(body) {
  if (!DEMO_AI_MODES.has(body.mode)) return { ok: true };  // 写真の保存・スプレッドシート送信は、したことにするだけ
  const res = await fetch(CONFIG.SUPABASE_URL + '/functions/v1/' + DEMO_FUNCTION, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + CONFIG.SUPABASE_ANON_KEY },
    body: JSON.stringify(body),
  });
  let j = null; try { j = await res.json(); } catch {}
  if (!res.ok) { const e = new Error((j && j.error) || '接続エラー（' + res.status + '）'); e.context = { json: async () => j }; throw e; }
  return j;
}
const DEMO_SB = {
  async rpc(name, args) {
    if (name === 'onboarding_invite_status') return { data: 'ok', error: null };
    if (name === 'onboarding_invite_get') return { data: { ...DEMO_PRESET }, error: null };
    if (name === 'onboarding_invite_save') {
      // 送信が終わったら、次に開いた時は最初からになるようにする
      if (args && args.p_final) demoClear();
      return { data: 'ok', error: null };
    }
    return { data: null, error: null };
  },
  functions: { async invoke(_name, opts) { try { return { data: await demoAI((opts && opts.body) || {}), error: null }; } catch (e) { return { data: null, error: e }; } } },
  storage: { from: () => ({ createSignedUrl: async () => ({ data: null, error: { message: '体験版では使えません' } }) }) },
};
function demoClear() {
  for (const s of [localStorage, sessionStorage]) {
    try { Object.keys(s).filter(k => k.startsWith('onboarding-')).forEach(k => s.removeItem(k)); } catch {}
  }
}
// 体験版は、開くたびに最初（書類を撮る画面の前）から始める（前回の続きから再開すると、途中の画面から始まって分かりづらいため）
demoClear();
function demoReset() {
  if (!confirm('入力した内容を消して、最初からやり直しますか？')) return;
  demoClear(); location.reload();
}
</script>

    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;

/* ---------- 郵便番号：日本郵便の郵便番号データ（zip/都道府県コード.json）で、住所から引く ---------- */
// AIの推測は使わない。書類から住所が入ったら、ここで郵便番号を自動で入れる
const PREFS = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県',
  '新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県',
  '鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
const zipFiles = {};
const loadPref = code => zipFiles[code] || (zipFiles[code] = fetch('zip/' + code + '.json').then(r => r.ok ? r.json() : null).catch(() => null)
  .then(j => { if (!j) delete zipFiles[code]; return j; }));
const normA = s => zen2han(s).replace(/[\s　]/g, '').replace(/[ヶヵケ]/g, 'ケ').replace(/[のノ之]/g, 'ノ');
const KNUM = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
const kanjiNum = s => { let n = 0, cur = 0; for (const c of s) { if (c === '十') { n += (cur || 1) * 10; cur = 0; } else cur = KNUM[c] || 0; } return n + cur; };
// 「1~19丁目」「20丁目」「1,2丁目」「100~200番地」などの補足に、番地・丁目の数字が入るか
function noteHas(note, n) {
  let found = false, any = false;
  for (const m of note.matchAll(/(\d+)(?:~(\d+))?(?=[^\d~]|$)/g)) { any = true; const lo = +m[1], hi = m[2] ? +m[2] : lo; if (n >= lo && n <= hi) found = true; }
  return { any, found };
}
async function zipFromAddress(addr) {
  let a = normA(addr);
  const pi = PREFS.findIndex(p => a.startsWith(p));
  if (pi < 0) return null;
  a = a.slice(PREFS[pi].length);
  const d = await loadPref(String(pi + 1).padStart(2, '0'));
  if (!d) return null;
  let city = null, clen = 0;
  for (const c of Object.keys(d)) for (const v of [normA(c), normA(c).replace(/^.+?郡/, '')]) if (v && a.startsWith(v) && v.length > clen) { city = c; clen = v.length; }
  if (!city) return null;
  const hadOaza = /^大字/.test(a.slice(clen));
  let rest = a.slice(clen).replace(/^大字|^字/, '');
  const rows = d[city];
  let tlen = 0;
  for (const r of rows) { const t = normA(r[0]); if (t && rest.startsWith(t) && t.length > tlen) tlen = t.length; }
  // 京都の「〇〇通〇〇上ル〇〇町」のように、町名の前に通り名がある住所は、途中に出てくる町名で探す
  if (!tlen) {
    let at = -1;
    for (const r of rows) { const t = normA(r[0]); const i = t.length >= 2 ? rest.indexOf(t) : -1; if (i >= 0 && t.length > tlen) { tlen = t.length; at = i; } }
    if (at > 0) rest = rest.slice(at);
  }
  let cands = tlen ? rows.filter(r => normA(r[0]).length === tlen && rest.startsWith(normA(r[0]))) : rows.filter(r => !r[0]);
  if (cands.some(r => r[2] === '大字')) { const f = cands.filter(r => (r[2] === '大字') === hadOaza); if (f.length) cands = f; }
  if (!cands.length) cands = rows.filter(r => !r[0]);
  if (new Set(cands.map(r => r[1])).size > 1) {
    const after = rest.slice(tlen);
    const m = after.match(/^(\d+)/) || after.match(/^([一二三四五六七八九十]+)丁目/);
    const n = m ? (/\d/.test(m[1]) ? +m[1] : kanjiNum(m[1])) : null;
    if (n != null) {
      const hit = cands.filter(r => r[2] && !/除く/.test(r[2]) && noteHas(r[2], n).found);
      const general = cands.filter(r => !r[2] || /除く/.test(r[2]) || !noteHas(r[2], n).any);
      cands = hit.length ? hit : general.length ? general : cands;
    }
  }
  const zips = [...new Set(cands.map(r => r[1]))];

}
const fmtZip = z => z.slice(0, 3) + '-' + z.slice(3);

}

// 形：{ "0005": ["三菱UFJ", "ミツビシユ－エフジエイ", "本店:001|丸の内:002|…"], … }
let bankFile = null;

  .then(j => { if (!j) { bankFile = null; return null; } return j; }));
// 画面に出す名前（一覧は「三菱UFJ」「川口信金」のような略称なので、正式な呼び方にする）
const bankDisplay = (code, name) => +code < 1000 || code === '9900' ? name + '銀行'
  : name.replace(/信金$/, '信用金庫').replace(/信組$/, '信用組合').replace(/労金$/, '労働金庫');
const normBank = s => String(s ?? '').normalize('NFKC').replace(/[\s　]/g, '').replace(/株式会社|\(株\)/g, '').toUpperCase()
  .replace(/信用金庫$/, '信金').replace(/信用組合$/, '信組').replace(/労働金庫$/, '労金').replace(/銀行$/, '');
// 「栄」→「栄支店」。「本店営業部」「〇〇出張所」などはそのまま
const branchLabel = name => /(店|部|所)$/.test(name) ? name : name + '支店';

// ※支店は完全に同じ名前の時だけ（「栄」を「栄町」と取り違えると、違う支店番号が入ってしまうため）
function pickOne(list, want, nameOf, prefix = false) {
  if (!want) return null;
  const exact = list.filter(x => nameOf(x) === want);
  if (exact.length) return exact.length === 1 ? exact[0] : null;
  if (!prefix || want.length < 2) return null;
  const pre = list.filter(x => nameOf(x).startsWith(want));
  return pre.length === 1 ? pre[0] : null;
}
async function findBank(name) {
  const j = await loadBanks(); if (!j) return null;
  const hit = pickOne(Object.entries(j), normBank(name), ([, v]) => normBank(v[0]), true);
  if (!hit) return null;
  const [code, [short, , br]] = hit;
  return { code, name: bankDisplay(code, short), branches: br ? br.split('|').map(x => { const i = x.lastIndexOf(':'); return { name: x.slice(0, i), code: x.slice(i + 1) }; }) : [] };
}

  });
  const close = () => { canceled = true; stopVoice(); clearTimeout(recordTimer); back.remove(); };
  const hasMore = () => step < VOICE_ROUNDS && remainingLines().length > voiceChunkNow.length;
  const send = h('button', { class: 'btn primary wide', type: 'button' }, '自動で項目に入れる');
  send.addEventListener('click', async () => {
    stopVoice(); const t = ta.value.trim();
    if (!t) { status.textContent = '話した内容がまだありません。'; return; }
    close(); const done = busy('項目に入れています…');
    try { const res = await callAI({ mode: 'voice', transcript: t, fields: [...fieldSpec(VOICE_KEYS), ACCOUNT_SPEC] }); done(); const gotAccount = takeAccountFromVoice(res); voiceDraft = ''; if (gotAccount && !Object.keys(res.values || {}).length) toast('口座番号を入れました。送信前の画面で確認してください。'); else applyAI(res, {}, { noScroll: true }); if (step < VOICE_ROUNDS && remainingLines().length) setTimeout(() => openVoice(step + 1), 700); else voiceFinished(); }
    catch (e) { done(); toast('うまくいきませんでした：' + e.message, 6000); }
  });
  const skip = h('button', { class: 'btn outline wide', type: 'button' }, '⏭ この項目は飛ばす（わからない・当てはまらない）');
  skip.addEventListener('click', () => {
    voiceChunkNow.forEach(t => voiceSkipped.add(t));
    close();
    if (step < VOICE_ROUNDS && remainingLines().length) openVoice(step + 1); else voiceFinished();
  });
  const back = h('div', { class: 'backdrop' }, h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': '話して入力' },
    h('div', { class: 'sheet-top' }, h('h2', {}, '話して入力'), h('button', { class: 'icon-btn', type: 'button', 'aria-label': '閉じる', onclick: close }, icon('close'))),
    h('p', { class: 'note' }, '💡 途中で詰まったり、わからない部分があったりしたら、そこは飛ばして次を読んで大丈夫です。あとで画面で直せます。'),
    scriptBox(voiceValues(), VOICE_AVAIL, step),
    mic, label, status, checkNote, ta, send, skip,
    h('p', { class: 'voice-foot' }, '録音は文字起こしのためOpenAIへ送ります（OpenAIのAPIでは、送った音声が学習などほかの目的に使われることはありません）。表示された文字を確認してから項目に入力します。', h('br'),
      'カード番号・マイナンバーは話さないでください（話しても入力されません）。口座番号は話してOKです（ツールには保存せず、送信の時にスプレッドシートへ直接送ります）。')));
  back.addEventListener('click', e => { if (e.target === back) close(); });
  if (hasMore()) send.textContent = '入力して次の項目へ';
  checkNote.textContent = `✏️ 文字になった内容をご確認ください。間違いがあれば、下の欄をタップして手入力で直してから、「${send.textContent}」を押してください。`;
  if (voiceDraft.trim() && canRecord) label.textContent = 'もう一度録音する';
  if (!voiceChunkNow.length) skip.hidden = true;
  document.body.append(back);
}

/* ---------- 体験版：送信後のボタンは外へ飛ばない ---------- */
function demoBlock(go, title, text, btnClass, btnText, toastMsg, after = []) {
  return h('section', { class: 'sec', 'data-go': go, style: 'text-align:left;width:100%' }, h('div', { class: 'sec-body', style: 'padding-top:16px' },
    h('strong', {}, title),
    h('p', { class: 'small muted', style: 'margin:0' }, text),
    h('button', { class: btnClass, type: 'button', onclick: () => { toast(toastMsg, 5000); goNext(go); } }, btnText),
    h('p', { class: 'demo-note' }, '🧪 体験版のため、このボタンを押しても画面は移動しません'),
    ...after));
}
payBlock = function (again = false, no = '') {
  return demoBlock('pay', no + 'サポート料 9,800円のお支払い',
    '決済システムStripe（ストライプ）の安全なお支払い画面が開きます。' + (again ? 'お支払い済みの方は不要です。' : ''),
    'btn primary wide', 'お支払い画面を開く', '体験版のため、お支払い画面には進みません。本番ではここでStripeのお支払い画面が開きます。',
    [h('p', { class: 'pay-done', hidden: true }, '✓ お支払い画面を開きました。お支払いが済んだら、次へお進みください。'), ...contractBlock()]);
};
lineBlock = function (no = '') {
  return demoBlock('line', no + '公式LINEに登録してください', 'ご契約後のお手続き（住所変更・カードの変更・引き出しなど）についての、お問い合わせ窓口です。',
    'btn wide line-btn', 'LINEで友だち追加する', '体験版のため、LINEには移動しません。本番ではここで公式LINEの友だち追加が開きます。');
};

boot();
