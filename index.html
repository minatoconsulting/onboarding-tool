<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6457">
<title>申込入力（管理者サイト）</title>
<!-- LINEなどでリンクを送った時に出る名前と説明 -->
<meta property="og:title" content="申込入力（管理者サイト）">
<meta property="og:description" content="ビジネスメンバー用の管理画面です（お客様用ではありません）">
<meta property="og:type" content="website">
<meta property="og:image" content="https://minatoconsulting.github.io/onboarding-tool/icon-512.png">
<meta name="description" content="ビジネスメンバー用の管理画面です（お客様用ではありません）">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --paper:#F3F6F7;--surface:#FFFFFF;--ink:#16222B;--muted:#5B6A75;--line:#D3DCE2;
  --seal:#1F6457;--seal-ink:#FFFFFF;--seal-soft:#E2EFEB;
  --ai:#FFF3CC;--ai-line:#C9961A;--ai-ink:#6B4E00;
  --danger:#AE3A2A;--dock-h:84px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F161B;--surface:#172128;--ink:#E5EDF1;--muted:#97A7B2;--line:#2A3943;
  --seal:#4E9F8D;--seal-ink:#06110E;--seal-soft:#1B2F2A;
  --ai:#382D10;--ai-line:#D9AE3E;--ai-ink:#F2D58A;--danger:#E07A69;
}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(var(--dock-h) + 48px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-title{flex:1;min-width:0;margin:0;font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save{font-size:.76rem;color:var(--muted);white-space:nowrap;background:none;border:0;padding:4px;cursor:default}
.save.bad{color:var(--danger);cursor:pointer;text-decoration:underline}
.status-sel{font-size:.85rem;min-height:36px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--seal-ink);font-weight:700}
.btn.outline{border-color:var(--seal);color:var(--seal);background:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.sm{min-height:36px;padding:0 10px;font-size:.88rem}
.btn.wide{width:100%}
a.btn{text-decoration:none;color:inherit}
a.btn.outline{color:var(--seal)}
a.btn.ghost{color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{flex:none;width:40px;height:40px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
.sec-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:transparent;text-align:left;cursor:pointer}
.num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.sec.done .num{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.sec-title{flex:1;font-weight:700}
.count{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px;transition:transform .2s}
.sec-head[aria-expanded="false"] .chev{transform:rotate(-45deg);margin-bottom:0}
.sec-body{padding:2px 16px 18px;display:grid;gap:14px}
.note{margin:0;padding:10px 12px;border-radius:8px;background:var(--seal-soft);font-size:.86rem}

.field{display:grid;gap:4px}
.field-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.field label{font-size:.88rem;font-weight:500}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.field textarea{resize:vertical;min-height:84px}
.hint{color:var(--muted);font-size:.78rem}
.field.ai input,.field.ai select,.field.ai textarea{background:var(--ai);border-color:var(--ai-line)}
.ok-btn{display:none;border:1px solid var(--ai-line);background:var(--ai);color:var(--ai-ink);font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 10px;cursor:pointer;white-space:nowrap}
.field.ai .ok-btn{display:inline-block}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.dock-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.dock-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:.78rem;font-weight:500;line-height:1.3;cursor:pointer;text-align:center}
.dock-btn svg{width:24px;height:24px}
.dock-btn.primary{background:var(--seal);border-color:var(--seal);color:var(--seal-ink);font-weight:700;font-size:.88rem}

.list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.row{width:100%;display:grid;grid-template-columns:1fr auto;grid-template-areas:"name chip" "date chip";gap:0 10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer}
.row-name{grid-area:name;font-weight:700}
.row-date{grid-area:date;font-size:.78rem;color:var(--muted)}
.chip{grid-area:chip;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.chip.s-b{border-color:var(--ai-line);color:var(--ai-ink);background:var(--ai)}
.chip.s-c{border-color:var(--seal);color:var(--seal-ink);background:var(--seal)}
.entry-card{margin:12px 0 0}
.hello{display:flex;align-items:center;gap:14px;margin:0 0 14px;padding:14px 16px;border-radius:16px;background:var(--seal-soft)}
.hello-ill{flex:0 0 auto;width:96px;height:78px}
.hello-ill svg,.empty-ill svg,.btn-ill svg,.entry-ill svg,.row-ava svg{width:100%;height:100%;display:block}
.hello-txt{min-width:0}
.hello-txt strong{display:block;font-size:1.05rem}
.hello-stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hello-stats span{padding:2px 10px;border-radius:999px;background:var(--surface);font-size:.78rem;font-weight:700;color:var(--muted)}
.hello-stats b{color:var(--ink);font-size:.9rem;margin-left:2px}
.btn-ill{width:22px;height:22px}
.btn-two{flex-direction:column;gap:2px;min-height:62px;padding:10px 16px}
.btn-two .btn-main{display:inline-flex;align-items:center;gap:6px}
.btn-sub{font-size:.76rem;font-weight:500;line-height:1.4;opacity:.85}
.entry-card>summary>span{text-align:center}
.entry-sub{display:block;font-size:.76rem;font-weight:500;color:var(--muted);line-height:1.4}
.entry-ill{flex:0 0 auto;width:26px;height:26px}
.row.ava{grid-template-columns:auto 1fr auto;grid-template-areas:"ava name chip" "ava date chip"}
.row-ava{grid-area:ava;width:40px;height:40px;margin-right:2px}
.empty{text-align:center;padding:18px 8px 6px}
.empty-ill{display:block;width:150px;height:116px;margin:0 auto 8px}
.entry-card>summary{display:flex;justify-content:center;align-items:center;gap:8px;list-style:none}
.entry-card>summary::-webkit-details-marker{display:none}
.entry-sep{border:0;border-top:2px dashed var(--line);margin:18px 0 6px}
.search{width:100%;min-height:46px;margin-top:12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.pad{padding:12px 4px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.err{color:var(--danger);margin:0}

.login,.setup{max-width:420px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top,0px)) 20px 40px;display:grid;gap:14px}
.login h1,.setup h1{margin:0;font-size:1.6rem;letter-spacing:.02em}
.login p,.setup p{margin:0}
.lbl{display:grid;gap:4px;font-size:.88rem;font-weight:500}
.lbl input{min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.auth-links{display:grid;gap:6px;justify-items:center;margin-top:6px}
.linkbtn{background:none;border:0;color:var(--seal);font:inherit;font-size:.92rem;text-decoration:underline;padding:6px;cursor:pointer}
.code-in{letter-spacing:.35em;text-align:center;font-size:1.3rem !important;font-variant-numeric:tabular-nums}
.ok-msg{color:var(--seal);margin:0}
.join-box{display:grid;gap:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.mem-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mem-row:last-child{border-bottom:0}
.mem-main{flex:1;min-width:0;display:grid;gap:2px}
.mem-main strong{overflow-wrap:anywhere;font-size:.95rem}

.backdrop{position:fixed;inset:0;z-index:50;background:rgba(8,16,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:92vh;overflow:auto}
.sheet-top{display:flex;align-items:center;justify-content:space-between}
.sheet h2{margin:0;font-size:1.1rem}
.mic{justify-self:center;width:96px;height:96px;border-radius:50%;border:0;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;cursor:pointer;position:relative}
.mic svg{width:40px;height:40px}
.mic:disabled{opacity:.4;cursor:default}
.mic[aria-pressed="true"]{background:var(--danger)}
.mic[aria-pressed="true"]::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--danger);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{transform:scale(.92);opacity:.7}to{transform:scale(1.18);opacity:0}}
.mic-label{text-align:center;font-weight:700;margin:0}
.transcript{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px;line-height:1.6;resize:vertical}

.busy{position:fixed;inset:0;z-index:60;background:rgba(8,16,20,.5);display:grid;place-items:center}
.busy-card{background:var(--surface);padding:20px 24px;border-radius:14px;display:flex;align-items:center;gap:12px;font-weight:700}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--seal);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-h) + 22px + env(safe-area-inset-bottom,0px));z-index:70;width:max-content;max-width:min(92vw,560px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.danger-zone{margin-top:28px;display:grid}
@media (prefers-reduced-motion:reduce){.mic[aria-pressed="true"]::after,.spinner{animation:none}.chev{transition:none}}

.script{border:1px dashed var(--seal);background:var(--seal-soft);border-radius:12px;padding:12px 14px;max-height:38vh;overflow:auto}
.script-head{display:grid;gap:2px;margin-bottom:6px}
.script ol{margin:0;padding-left:1.4em;display:grid;gap:6px;font-size:.95rem;line-height:1.6}
.script mark{background:var(--ai);color:var(--ai-ink);border-radius:4px;padding:0 2px}

.doc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.doc-badge{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--ai-line);background:var(--ai);color:var(--ai-ink);white-space:nowrap}
.doc-badge.ok{border-color:var(--seal);background:var(--seal);color:var(--seal-ink)}
.shot-tips{display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.shot-tips ul{margin:0;padding-left:1.1em;font-size:.84rem;display:grid;gap:2px}
.frame{position:relative;width:84px;height:58px;flex:none}
.frame .card{position:absolute;inset:9px;border-radius:5px;background:var(--seal-soft);border:1.5px solid var(--seal)}
.frame .c{position:absolute;width:15px;height:15px;border:0 solid var(--danger)}
.frame .tl{top:0;left:0;border-top-width:3px;border-left-width:3px}
.frame .tr{top:0;right:0;border-top-width:3px;border-right-width:3px}
.frame .bl{bottom:0;left:0;border-bottom-width:3px;border-left-width:3px}
.frame .br{bottom:0;right:0;border-bottom-width:3px;border-right-width:3px}
.doc-group{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.doc-group.done{border-color:var(--seal)}
.doc-name{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:2px 0 4px}
.doc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.doc-label{display:grid;gap:0}
.doc-actions{display:flex;gap:6px;flex:none}
.doc-ok{color:var(--seal);font-weight:700;font-size:.8rem}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip-btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:.84rem;cursor:pointer;min-height:34px}
.chip-btn:active{background:var(--seal-soft);border-color:var(--seal)}
.chip-btn.on{background:var(--seal);border-color:var(--seal);color:var(--seal-ink);font-weight:700}
.warn{margin:0;padding:10px 12px;border-radius:8px;background:#FDECEA;color:#8A2A1D;border:1px solid #F2B8AE;font-size:.88rem;display:grid;gap:4px}
.warn p{margin:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3A1E1A;color:#F2B8AE;border-color:#6B3328}}

.doc-name{gap:10px;justify-content:flex-start}
.doc-title{flex:1}
.doc-ill{width:54px;height:38px;flex:none;display:inline-flex}
.doc-ill svg,.tip-ill svg,.need-ill svg,.hero-ill svg,.flow-ill svg{width:100%;height:100%}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;background:var(--paper);font-size:.78rem;font-weight:700;text-align:center}
.tip-ill{width:34px;height:34px;display:inline-flex}
.sec.secret{border:1px dashed var(--ai-line)}
.card-entry{display:grid;gap:12px}
.sec.prep-box{border:3px solid var(--seal);box-shadow:0 0 0 5px var(--seal-soft)}
.sec.prep-box .sec-title::before{content:'まず入力';display:inline-block;margin-right:8px;font-size:.72rem;font-weight:800;color:var(--seal-ink);background:var(--seal);border-radius:999px;padding:2px 10px;vertical-align:middle}
.voice-foot{margin:0;font-size:.72rem;line-height:1.55;color:var(--muted)}
.photo-pick{display:grid;gap:10px}
.field.bad input{border-color:var(--danger)}
.field-err:empty{display:none}
.sec.manual-box{border:2px solid var(--seal);box-shadow:0 0 0 4px var(--seal-soft)}
.manual-tag{display:inline-block;font-size:.72rem;font-weight:800;color:var(--seal-ink);background:var(--seal);border-radius:999px;padding:2px 10px;margin-right:6px;vertical-align:middle}
.btn.toggle[aria-pressed="true"]{background:var(--seal);border-color:var(--seal);color:var(--seal-ink);font-weight:700}
.sheet p[role=status]:empty{display:none}
.bg-pill{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.15);font-size:.86rem;font-weight:700}
.bg-pill .spinner{flex:none;width:18px;height:18px}
.btn svg{width:20px;height:20px;flex:none}
a.btn{text-decoration:none}

.kbd-guide{display:grid;gap:8px;padding:12px 14px;border-radius:12px;background:var(--seal-soft)}
.kbd-guide strong{font-size:1rem}
.kbd-steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kbd-steps li{display:flex;align-items:center;gap:10px;font-size:.92rem}
.kbd-steps .num{width:24px;height:24px;font-size:.78rem;background:var(--surface)}
.kbd-mic{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:var(--surface);border:1px solid var(--line);vertical-align:middle}
.kbd-mic svg{width:16px;height:16px}

/* お客様の進み具合・フォロー */
.row.ava{grid-template-areas:"ava name chip" "ava date chip" "ava prog prog"}
.row-prog{grid-area:prog;font-size:.78rem;color:var(--ink);margin-top:2px}
.row-prog:empty{display:none}
.follow-tag{display:inline-block;margin-right:6px;padding:0 8px;border-radius:999px;background:#FDECEA;color:#8A2A1D;border:1px solid #F2B8AE;font-weight:700;font-size:.74rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .follow-tag{background:#3A1E1A;color:#F2B8AE;border-color:#6B3328}}
.follow-btn[aria-pressed="true"]{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.invite-actions{display:grid;gap:8px}
.fix-list{display:grid;gap:6px}
.fix-list label{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;font-size:.92rem}
.fix-list input{width:20px;height:20px;flex:none}
</style>
</head>

  FUNCTION_NAME: 'onboarding-extract',

};

/* =========================================================
   ② 入力項目（ITA申込サイトの順番にそろえています）

const F = (k, label, o = {}) => ({ k, label, type: 'text', ...o });
const ID_TYPES = ['運転免許証', 'パスポート', 'マイナンバーカード'];
// サポート料：9,800円（これまで通り）／22,000円（別会社のグループ。お客様の画面の公式LINE・お支払い先が変わる）

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

function icon(name) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
  s.innerHTML = ICONS[name];  // 固定の図形だけなので安全

function toast(msg, ms = 3200) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = h('div', { class: 'toast', role: 'status' }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), ms);
}

}

async function boot() {
  if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) return viewSetup();
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const { data: { session } } = await sb.auth.getSession();
  accessToken = session ? session.access_token : '';
  sb.auth.onAuthStateChange((_ev, s) => { accessToken = s ? s.access_token : ''; });
  session ? viewList() : viewLogin();
}

function viewLogin(msg = '') {
  const email = h('input', { type: 'email', autocomplete: 'username', inputmode: 'email' });
  const pw = h('input', { type: 'password', autocomplete: 'current-password' });
  const err = h('p', { class: 'err', role: 'alert' });
  const btn = h('button', { class: 'btn primary wide', type: 'button', onclick: async () => {
    btn.disabled = true; err.textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pw.value });
    btn.disabled = false;
    if (error) { err.textContent = 'メールアドレスかパスワードが違います。'; return; }
    viewList();
  }}, 'ログイン');
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
  authPage('申込入力', '免許証の撮影と音声で、ITAの申込情報をまとめます。',
    msg ? h('p', { class: 'ok-msg', role: 'status' }, msg) : null,
    h('label', { class: 'lbl' }, 'メールアドレス', email),
    h('label', { class: 'lbl' }, 'パスワード', pw),
    btn, err,
    h('div', { class: 'auth-links' },
      h('button', { class: 'linkbtn', type: 'button', onclick: () => viewSignup() }, 'はじめての方：新規登録はこちら'),

}

    if (pw.value.length < 8) { err.textContent = 'パスワードは8文字以上にしてください。'; return; }
    if (pw.value !== pw2.value) { err.textContent = 'パスワードが2回とも同じになっているか確認してください。'; return; }
    if (!code.value.trim()) { err.textContent = '合言葉を入れてください（分からない時は管理者に聞いてください）。'; return; }
    btn.disabled = true;
    const done = busy('登録中…');
    try {
      const { data, error } = await sb.functions.invoke(SIGNUP_FN, { body: { mode: 'signup', email: e, password: pw.value, code: code.value.trim() } });
      const r = error ? 'error' : String((data && data.result) || 'error');
      if (r === 'exists') {
        err.replaceChildren('このメールアドレスは登録済みです。ログインしてください（「すごろく」と同じアカウントの方も、そのパスワードでログインできます）。',
          h('button', { class: 'linkbtn', type: 'button', onclick: () => viewLogin('ログインしたあと、合言葉を入れると使えるようになります。') }, 'ログイン画面へ'));
        return;
      }
      if (r !== 'ok') { err.textContent = SIGNUP_MSG[r] || SIGNUP_MSG.error; return; }
      const { error: e2 } = await sb.auth.signInWithPassword({ email: e, password: pw.value });
      if (e2) { viewLogin('登録できました。メールアドレスとパスワードでログインしてください。'); return; }
      toast('登録できました。ようこそ！', 4000);
      viewList();
    } finally { done(); btn.disabled = false; }
  }}, '登録する');
  authPage('新規登録', 'ビジネスメンバーの方の登録です。管理者から聞いた合言葉が必要です。',
    h('label', { class: 'lbl' }, 'メールアドレス', email),
    h('label', { class: 'lbl' }, 'パスワード（8文字以上）', pw),
    h('label', { class: 'lbl' }, 'パスワード（確認のため、もう一度）', pw2),
    h('label', { class: 'lbl' }, '合言葉', code, h('small', { class: 'muted' }, '管理者から聞いた合言葉を入れてください')),
    btn, err,
    h('div', { class: 'auth-links' }, h('button', { class: 'linkbtn', type: 'button', onclick: () => viewLogin() }, '登録済みの方：ログインに戻る')));
}

  const code = h('input', { type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  const err = h('p', { class: 'err', role: 'alert' }, JOIN_MSG[reason] || '');

// 持ち主のいない書類写真（お客様を削除した後に残ったもの）を消す
function orphanBox() {
  const msg = h('p', { class: 'small', role: 'status' }, '確認中…');
  const btn = h('button', { class: 'btn danger wide', type: 'button', hidden: true });
  const box = h('section', { class: 'join-box', style: 'margin-top:16px' },
    h('strong', {}, '🧹 持ち主のいない書類写真'),
    h('p', { class: 'small muted', style: 'margin:0' }, '削除したお客様の本人確認書類の写真が残っていないかを調べます。消した写真は元に戻せません。'),
    msg, btn);
  const check = async () => {
    try {
      const r = await callAI({ mode: 'purge_orphans', dryRun: true });
      if (!r.folders) { msg.textContent = '✓ 残っている写真はありません。'; btn.hidden = true; return; }
      msg.textContent = `削除したお客様 ${r.folders}人分の写真（${r.files}枚）が残っています。`;
      btn.textContent = `残っている写真 ${r.files}枚を消す`; btn.hidden = false;
    } catch (e) { msg.textContent = '調べられませんでした：' + e.message; }
  };
  btn.addEventListener('click', async () => {
    if (!confirm('削除したお客様の書類写真を消します。元に戻せません。よろしいですか？')) return;
    const done = busy('消しています…');
    try { const r = await callAI({ mode: 'purge_orphans' }); done(); toast(`${r.files}枚の写真を消しました。`, 4000); }
    catch (e) { done(); toast('消せませんでした：' + e.message, 6000); }
    check();
  });
  check();
  return box;
}

// お客様に入れてもらう主な項目（受取人は「指定しない」でもよいので1つ、書類2点もまとめて1つとして数える）
const PROG_KEYS = ['name_ja', 'name_kana', 'gender', 'birth_date', 'id_number', 'id_issue_date', 'id_expiry', 'email', 'phone_area', 'address_ja', 'postal_code',
  'employer_type', 'employer_name', 'employer_address', 'industry', 'position', 'job_detail', 'employment_start', 'income_amount',
  'card_kind', 'card_brand', 'card_company', 'bank_name', 'bank_branch', 'bank_branch_no', 'bank_open_date', 'fund_method', 'fund_amount', 'savings_amount', 'purpose'];

const SEEN_STEPS = ['最初の画面', '書類の撮影', '話して入力', '内容の確認', '送信の画面'];
function progressOf(d = {}) {
  const filled = PROG_KEYS.filter(k => String(d[k] ?? '').trim()).length;
  const ben = d.ben_none === 'はい' || String(d.ben_name_ja || '').trim() ? 1 : 0;
  const docs = docStatus(d).ok ? 1 : 0;
  const total = PROG_KEYS.length + 2, done = filled + ben + docs;
  return { pct: Math.round(done / total * 100), left: total - done, docsOk: !!docs };

const daysLeft = iso => Math.max(0, Math.ceil((new Date(iso) - Date.now()) / 86400000));
const fmtDay = iso => { const t = new Date(iso); return (t.getMonth() + 1) + '月' + t.getDate() + '日'; };

// リンクの状態：none（まだ作っていない）・active（入力待ち）・expired（期限切れ）・submitted（送信済み）
function inviteState(inv) {
  if (!inv) return 'none';
  if (inv.submitted_at) return 'submitted';
  return new Date(inv.expires_at) > new Date() ? 'active' : 'expired';
}
// 声をかけた方がいいお客様：未送信のリンクがあって、期限切れ・期限が近い・2日以上止まっている・まだ開いていない
const STALL_MS = 2 * 86400000;
function needsFollow(r, inv) {
  const st = inviteState(inv);
  if (st === 'expired') return 'リンクの期限切れ';
  if (st !== 'active') return '';
  if (daysLeft(inv.expires_at) <= 2) return '期限まであと' + daysLeft(inv.expires_at) + '日';
  const seen = r.data && r.data._seen;
  if (Date.now() - new Date(seen ? seen.at : inv.created_at) > STALL_MS) return seen ? '2日以上止まっています' : 'まだ開かれていません';
  return '';
}

  const d = r.data || {}, seen = d._seen, p = progressOf(d);
  return [inv.fix ? '修正をお願い中' : '',
    seen ? `入力 ${p.pct}%（あと${p.left}項目）・${SEEN_STEPS[seen.step] || ''}・最後に開いた ${fmtAt(seen.at)}` : 'まだ開かれていません',
    st === 'expired' ? 'リンクの期限切れ' : 'リンクの期限 ' + fmtDay(inv.expires_at) + '（あと' + daysLeft(inv.expires_at) + '日）'].filter(Boolean).join('・');
}

/* ---------- 保存（入力をやめて1秒ほどで自動保存） ---------- */
function scheduleSave(delay = 1200) {
  if (!state) return;
  saveEl.textContent = '保存待ち'; saveEl.classList.remove('bad');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, delay);
}
// 送る内容を作って、送ったぶんの「変えた印」を空にする（失敗した時は putBack で戻す）
function takePatch() {
  const keys = [...dirty]; const patch = {};
  for (const k of keys) if (k !== '_ai' && k !== '_guess') patch[k] = state.data[k] ?? '';
  const ops = {};
  for (const name of ['_ai', '_guess']) {
    const o = listOps[name];
    if (o.add.size || o.del.size) ops[name] = { add: [...o.add], del: [...o.del] };
  }
  if (Object.keys(ops).length) patch._list_ops = ops;
  const sentStatus = statusDirty ? state.status : null;
  dirty = new Set(); statusDirty = false; resetListOps();
  const putBack = () => {
    keys.forEach(k => dirty.add(k)); if (sentStatus) statusDirty = true;
    for (const [name, o] of Object.entries(ops)) {
      o.add.forEach(k => { if (!listOps[name].del.has(k)) listOps[name].add.add(k); });
      o.del.forEach(k => { if (!listOps[name].add.has(k)) listOps[name].del.add(k); });
    }
  };
  return { patch, sentStatus, putBack, empty: !keys.length && !sentStatus };
}
let saveOk = true;
async function save() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!state) return true;
  // 前の保存が終わるのを待ってから送る（届く順番が入れ替わって、古い値が残らないように）
  if (savePromise) { try { await savePromise; } catch {} }
  if (!state) return true;
  const { patch, sentStatus, putBack, empty } = takePatch();
  if (empty) { saveEl.textContent = saveOk ? '保存済み' : saveEl.textContent; return saveOk; }
  saveEl.textContent = '保存中…'; saveEl.classList.remove('bad');
  const id = state.id;
  // 変えた項目だけ送る（お客様がリンクから入れた内容を消さないため）
  const pending = sb.rpc('onboarding_merge', { p_id: id, p_patch: patch, p_status: sentStatus });
  savePromise = pending;
  let res;
  try { res = await pending; } catch (e) { res = { error: e }; }
  if (savePromise === pending) savePromise = null;
  // 0件 ＝ このお客様を保存する権限がない（メンバーを停止された時など）
  const error = res.error || (res.data === 0 ? { message: 'このお客様を保存する権限がありません' } : null);
  if (!state || state.id !== id) return !error;
  if (error) {
    putBack(); saveOk = false;
    saveEl.textContent = /JWT|token/i.test(error.message || '') ? 'ログインが切れました（押して再試行）' : '保存できませんでした（押して再試行）';
    saveEl.classList.add('bad');
    return false;
  }
  saveOk = true;
  saveEl.textContent = '保存済み'; saveEl.classList.remove('bad');
  return true;
}
// 保存待ちを今すぐ保存する。保存できたら true
async function flushSave() {
  if (saveTimer || dirty.size || statusDirty) return save();
  if (savePromise) { try { await savePromise; } catch {} }
  return saveOk && !dirty.size;
}
// 画面を閉じる・別のアプリに切り替える時は、待たずに届く送り方（keepalive）で保存する
let accessToken = '';
function saveBeforeLeave() {
  if (!state || !accessToken || (!saveTimer && !dirty.size && !statusDirty)) return;
  clearTimeout(saveTimer); saveTimer = null;
  const { patch, sentStatus, putBack } = takePatch();
  // 届いたか分からないので、画面に戻ってきた時にもう一度保存できるように、送った内容を「保存待ち」に戻しておく
  putBack();
  try {
    fetch(CONFIG.SUPABASE_URL + '/rest/v1/rpc/onboarding_merge', {
      method: 'POST', keepalive: true,
      headers: { apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_id: state.id, p_patch: patch, p_status: sentStatus }),
    });
  } catch {}
}

function fieldSpec(keys) {
  return keys.map(k => FIELD_MAP[k]).filter(Boolean).map(f => ({ k: f.k, label: f.label, opts: f.opts, hint: f.hint }));
}
async function callAI(body) {
  const { data, error } = await sb.functions.invoke(CONFIG.FUNCTION_NAME, { body });
  if (error) {
    let msg = error.message;
    try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  if (data && data.error) throw new Error(data.error);

}
function applyAI(res, preset = {}, opts = {}) {
  const vals = (res && res.values) || {};
  const guess = new Set((res && res.uncertain) || []);
  let n = 0, first = null;
  for (const [k, v] of Object.entries(preset)) setField(k, v);
  for (const [k, raw] of Object.entries(vals)) {
    const f = FIELD_MAP[k]; if (!f || raw == null) continue;
    if (opts.since && (userEditAt[k] || 0) > opts.since) continue;
    let v = String(raw).trim(); if (!v) continue;
    if (f.type === 'select' && !f.opts.includes(v)) continue;
    if (f.type === 'date' && !/^\d{4}-\d{2}-\d{2}$/.test(v)) continue;
    if (f.type === 'number') v = v.replace(/[,，円\s]/g, '');
    if (k === 'contract_years' && /^\d+$/.test(yearsNum(v))) v = yearsNum(v) + '年';
    setField(k, v, { ai: true, guess: guess.has(k) });
    n++; first = first || k;
  }
  if ('fund_amount' in vals) syncFundAnnual();
  scheduleSave();
  if (!n) { toast(opts.emptyMsg || '読み取れる項目がありませんでした。明るい場所でもう一度お試しください。', 5000); return; }
  toast(`${n}項目を入力しました。黄色の欄を確認してください。`, 4500);

  const r = opts.since ? null : inputs[first];

}

  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85).split(',')[1];

/* ---------- 話して入力 ---------- */
function stopVoice() {
  recording = false;
  if (rec) { rec.onstop = null; try { if (rec.state !== 'inactive') rec.stop(); } catch {} rec = null; }
  if (voiceStream) { voiceStream.getTracks().forEach(t => t.stop()); voiceStream = null; }
}
function audioBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = () => reject(new Error('録音データを読み込めませんでした'));
    reader.readAsDataURL(blob);
  });
}

  if (!window.MediaRecorder || typeof MediaRecorder.isTypeSupported !== 'function') return '';
  return ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
}

  const canRecord = !!format && !!navigator.mediaDevices?.getUserMedia;
  const ta = h('textarea', { class: 'transcript', rows: '7', 'aria-label': '話した内容', placeholder: '例：勤務先は〇〇株式会社で事務をしていて、年収は450万円くらいです。メインで使っている銀行は〇〇銀行です。' });
  ta.value = state.voiceDraft; ta.addEventListener('input', () => { state.voiceDraft = ta.value; });
  const label = h('p', { class: 'mic-label' }, canRecord ? '押して録音を始める' : '音声入力または手入力');
  const status = h('p', { class: 'muted small', role: 'status' }, canRecord
    ? ''
    : 'この端末では録音できません。下の欄へ手入力するか、キーボードの音声入力をお使いください。');
  const mic = h('button', { class: 'mic', type: 'button', 'aria-pressed': 'false', 'aria-label': '録音', hidden: !canRecord }, icon('mic'));
  let canceled = false, recordTimer = null;
  const release = () => { clearTimeout(recordTimer); if (voiceStream) { voiceStream.getTracks().forEach(t => t.stop()); voiceStream = null; } };
  mic.addEventListener('click', async () => {
    if (recording) { recording = false; mic.disabled = true; status.textContent = '音声を文字にしています…'; rec.stop(); return; }
    mic.disabled = true;
    try {
      voiceStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      if (canceled) { release(); return; }
      const chunks = [];
      rec = new MediaRecorder(voiceStream, { mimeType: format });
      rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      rec.onerror = () => { stopVoice(); mic.disabled = false; send.disabled = false; status.textContent = '録音できませんでした。もう一度お試しください。'; };
      rec.onstop = async () => {
        const blob = new Blob(chunks, { type: format });
        rec = null; recording = false; release(); mic.setAttribute('aria-pressed', 'false'); label.textContent = 'もう一度録音する';
        if (canceled) return;
        if (!blob.size || blob.size > 4_000_000) { mic.disabled = false; send.disabled = false; status.textContent = '録音が短すぎるか長すぎます。短く区切って録り直してください。'; return; }
        try {
          const result = await callAI({ mode: 'transcribe', audio: await audioBase64(blob), mediaType: format });
          if (canceled) return;
          ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + result.text;
          state.voiceDraft = ta.value;
          status.textContent = '文字になりました。内容を確認して、下のボタンを押してください。';
        } catch (e) { if (!canceled) status.textContent = '文字起こしに失敗しました：' + e.message; }
        finally { mic.disabled = false; send.disabled = false; }
      };
      rec.start(); recording = true; mic.disabled = false; send.disabled = true; mic.setAttribute('aria-pressed', 'true'); label.textContent = '録音中…押して止める';
      recordTimer = setTimeout(() => { if (recording) mic.click(); }, 120000);
    } catch { release(); mic.disabled = false; status.textContent = 'マイクを使えません。ブラウザで許可するか、下の欄に手入力してください。'; }
  });
  const close = () => { canceled = true; stopVoice(); clearTimeout(recordTimer); back.remove(); };
  const hasMore = () => remainingLines().length > voiceChunkNow.length;
  const send = h('button', { class: 'btn primary wide', type: 'button' }, '自動で項目に入れる');
  send.addEventListener('click', async () => {
    stopVoice(); const t = ta.value.trim();
    if (!t) { status.textContent = '話した内容がまだありません。'; return; }
    close(); const done = busy('項目に入れています…');
    try { const res = await callAI({ mode: 'voice', transcript: t, fields: [...fieldSpec(VOICE_KEYS), ACCOUNT_SPEC] }); done(); const gotAccount = takeAccountFromVoice(res); state.voiceDraft = ''; if (gotAccount && !Object.keys(res.values || {}).length) toast('口座番号を入れました。送信前の画面で確認してください。'); else applyAI(res); if (remainingLines().length) setTimeout(() => openVoice(step + 1), 700); }
    catch (e) { done(); toast('うまくいきませんでした：' + e.message, 6000); }
  });
  const skip = h('button', { class: 'btn outline wide', type: 'button' }, '⏭ この項目は飛ばす（わからない・当てはまらない）');
  skip.addEventListener('click', () => {
    voiceChunkNow.forEach(t => voiceSkipped.add(t));
    close();
    if (remainingLines().length) openVoice(step + 1); else toast('読み上げる項目は以上です。');
  });
  const back = h('div', { class: 'backdrop' }, h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': '話して入力' },
    h('div', { class: 'sheet-top' }, h('h2', {}, '話して入力'), h('button', { class: 'icon-btn', type: 'button', 'aria-label': '閉じる', onclick: close }, icon('close'))),
    h('p', { class: 'note' }, '💡 途中で詰まったり、わからない部分があったりしたら、そこは飛ばして次を読んで大丈夫です。あとで画面で直せます。'),
    scriptBox(voiceValues(), VOICE_AVAIL, step),
    mic, label, status, ta, send, skip,
    h('p', { class: 'voice-foot' }, '録音は文字起こしのためOpenAIへ送ります（OpenAIのAPIでは、送った音声が学習などほかの目的に使われることはありません）。表示された文字を確認してから項目に入力します。', h('br'),
      'カード番号・マイナンバーは話さないでください（話しても入力されません）。口座番号は話してOKです（ツールには保存せず、送信の時にスプレッドシートへ直接送ります）。')));
  back.addEventListener('click', e => { if (e.target === back) close(); });
  if (hasMore()) send.textContent = '入力して次の項目へ';
  if (!voiceChunkNow.length) skip.hidden = true;
  document.body.append(back);
}

boot();
</script>
</body>
</html>
